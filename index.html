<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>倉吉北高等学校 ホームページ 公開前プレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
:root{--c-green:#254a3b;--c-accent:#FFD54F;--c-line:#e3e6e4;--c-gray:#6b7570;--bg:#f6f7f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#2a2a2a;font:15px/1.8 "Noto Sans JP",sans-serif;padding:48px max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
main{max-width:720px;margin:0 auto}
h1{font-family:"Shippori Mincho",serif;color:var(--c-green);font-size:1.6rem;line-height:1.4;margin:0 0 8px}
.lead{color:var(--c-gray);margin:0 0 32px}
.note{background:#fff;border-left:4px solid var(--c-accent);padding:12px 16px;margin:0 0 32px;font-size:.9rem}
ul{list-style:none;padding:0;margin:0;display:grid;gap:16px}
a.card{display:block;background:#fff;border:1px solid var(--c-line);border-radius:10px;padding:20px 22px;text-decoration:none;color:inherit;transition:border-color .2s,box-shadow .2s}
a.card:hover,a.card:focus-visible{border-color:var(--c-green);box-shadow:0 4px 14px rgba(37,74,59,.12);outline:none}
.card strong{display:block;color:var(--c-green);font-size:1.1rem}
.card span{display:block;color:var(--c-gray);font-size:.9rem;margin-top:4px}
footer{margin-top:40px;color:var(--c-gray);font-size:.8rem}
</style>
</head>
<body>
<main>
<h1>倉吉北高等学校 ホームページ<br>公開前プレビュー</h1>
<p class="lead">本番サイトに反映する前に、内容と表示をご確認いただくためのページです。</p>
<p class="note">ここに表示している内容は、まだ本番サイトには反映していません。</p>
<ul>
<li><a class="card" href="target-student/"><strong>在校生・保護者の方へ</strong><span>出席停止・登校許可証（インフルエンザ・新型コロナ／その他の感染症）と、公式LINE・マチコミメールの登録方法を追加</span></a></li>
<li><a class="card" href="community/"><strong>地域とつながる</strong><span>トップページのバナーと、地域とつながるページ（説明文は仮のものです）</span></a></li>
</ul>
<footer>制作・保守：ローディーネット</footer>
</main>
</body>
</html>
